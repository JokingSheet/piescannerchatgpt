name: Build Pie Scanner JAR

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-jar.yml'
      - 'pie-scanner-github/pie-final/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build mod
        working-directory: pie-scanner-github/pie-final
        run: chmod +x ./gradlew && ./gradlew build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: pie-scanner-jar
          path: pie-scanner-github/pie-final/build/libs/pie-scanner-1.0.0.jar
          if-no-files-found: error
          retention-days: 30
